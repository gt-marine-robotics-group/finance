{% extends "base.html" %}
{% block title %}Login - MRG Purchasing{% endblock %}

{% block content %}
<div class="login-page">
    <div class="login-card">
        <h1>MRG Purchasing</h1>
        <p class="login-subtitle">Marine Robotics Group</p>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <input
                    type="text"
                    name="name"
                    placeholder="GT Username (e.g. gburdell3)"
                    value="gburdell3"
                    required
                    autofocus
                    class="input"
                >
            </div>
            <div class="form-group">
                <input
                    type="password"
                    name="password"
                    placeholder="Team password"
                    required
                    class="input"
                >
            </div>
            <button type="submit" class="btn btn-primary btn-block">Log In</button>
        </form>
    </div>
</div>
{% endblock %}
